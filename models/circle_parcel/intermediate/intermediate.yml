
version: 2

models:
    - name: int_cc_parcel
      description: "add some extra info to the parcel"
      columns:
        - name: parcel_id
          description: id of the parcel
          tests:
            - not_null
            - unique
    - name: int_cc_parcel_product
      description: "adds details of the products"
      columns:
        - name: parcel_id
          description: id of the parcel
        - name: quantity
          description: number of items for a specific product in a parcel

            

            
      